name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # پاکسازی مسیر ویندوزی جاوا از فایل تنظیمات گریدل
      - name: Fix gradle.properties Java Home
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true

      - name: Clean Cache & Install dependencies
        run: |
          rm -f package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps --force

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x gradlew

      # Option 2: Setup Gradle with caching and network resilience
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-includes: |
            caches
            notifications
            jdks

      # Option 3: Verify and fix gradle-wrapper.properties
      - name: Verify Gradle Wrapper Version
        run: |
          if grep -q "gradle-9.0.0" android/gradle/wrapper/gradle-wrapper.properties; then
            echo "Using Gradle 9.0.0 - Rolling back to stable version 8.7"
            sed -i 's|gradle-9.0.0|gradle-8.7|g' android/gradle/wrapper/gradle-wrapper.properties
          fi
          cat android/gradle/wrapper/gradle-wrapper.properties

      # Option 1: Build Android APK with retry logic
      - name: Build Android APK
        run: |
          cd android
          for i in {1..3}; do
            echo "Build attempt $i/3..."
            if ./gradlew assembleDebug --no-daemon; then
              echo "Build successful!"
              break
            fi
            if [ $i -lt 3 ]; then
              echo "Build failed, retrying in 10 seconds..."
              sleep 10
            else
              echo "Build failed after 3 attempts"
              exit 1
            fi
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
