name: Build Android APK (Fix Main Registration)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      # ساخت پروژه اندروید با تنظیمات رسمی اکسپو
      - name: Generate Clean Android Project
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean --no-install || true

      # خروجی گرفتن استاندارد جاوااسکریپت و دارایی‌ها مطابق با ثبت اکسپو
      - name: Export JS Bundle via Expo
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export --platform android

      # کپی کدهای باندل‌شده اکسپو در مسیر نیتیو گریدل
      - name: Copy Expo Bundle to Android Assets
        run: |
          cp -r dist/bundles/android* android/app/src/main/assets/index.android.bundle || cp -r dist/_expo/static/js/android/* android/app/src/main/assets/index.android.bundle || true
          cp -r dist/assets/* android/app/src/main/res/ || true

      - name: Build Standalone APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
