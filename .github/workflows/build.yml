name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # نصب مستقیم ابزار Gradle روی سیستم‌عامل لینوکس سرور برای دور زدن مشکل دانلود Wrapper
      - name: Install Gradle System-wide
        run: sudo apt-get update && sudo apt-get install -y gradle

      - name: Clean Cache & Install dependencies
        run: |
          rm -f package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps --force

      # اجرای مستقیم بیلد با خود ابزار سیستم (بدون وابستگی به فایل‌های دانلود زپ Wrapper)
      - name: Build Android APK
        run: |
          cd android
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
