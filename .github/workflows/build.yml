name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # حل مشکل ارور 404 با حذف فایل‌های lock قدیمی و پاکسازی کش npm
      - name: Clean Cache & Install dependencies
        run: |
          rm -f package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps --force

      # اعطای دسترسی به gradlew و حل مشکل احتمالی Permission Denied
      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x gradlew

      # ساخت فایل APK با نادیده گرفتن هشدارهای کامپایل
      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # آپلود فایل APK خروجی در بخش Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
