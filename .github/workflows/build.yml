name: Build Android APK (Ultimate Fix)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ۱. نصب پکیج‌ها به تمیزترین شکل ممکن
      - name: Install dependencies
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      # ۲. راه حل طلایی: حذف پوشه آلوده اندروید و ساخت مجدد آن توسط اکسپو
      - name: Generate Fresh Android Project
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean

      # ۳. بیلد مستقیم با گریدلِ تمیز و بدون اکشن‌های واسطه و دردسرساز
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ۴. آپلود فایل نهایی
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
