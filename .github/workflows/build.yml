name: Build Standalone Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: |
          npm cache clean --force
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Generate Fresh Android Project
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean --no-install || true

      # ساخت کی‌استور موقت برای امضای APK جهت عدم مواجهه با خطا
      - name: Generate Temporary Keystore & Build Release
        run: |
          cd android
          chmod +x gradlew
          keytool -genkey -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          ./gradlew assembleRelease --no-daemon

      # پیدا کردن فایل APK ساخته شده و انتقال آن به مسیر مشخص
      - name: Prepare APK for Upload
        run: |
          mkdir -p output_apk
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} output_apk/app-release.apk \;

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: output_apk/app-release.apk
