name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fix gradle.properties Java Home
        run: |
          if [ -f android/gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' android/gradle.properties || true
          fi

      - name: Clean Cache & Install dependencies
        run: |
          rm -f package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps --force

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x gradlew

      - name: Verify Gradle Wrapper Version
        run: |
          GRADLE_PROPERTIES="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$GRADLE_PROPERTIES" ]; then
            if grep -q "gradle-9.0.0" "$GRADLE_PROPERTIES"; then
              echo "Rolling back from Gradle 9.0.0 to stable version 8.7"
              sed -i 's|gradle-9.0.0|gradle-8.7|g' "$GRADLE_PROPERTIES"
            fi
            echo "Gradle wrapper configuration:"
            cat "$GRADLE_PROPERTIES"
          else
            echo "Warning: gradle-wrapper.properties not found"
          fi

      - name: Setup Gradle with caching
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
          cache-read-only: false
          gradle-home-cache-cleanup: true

      - name: Build Android APK with retry logic
        run: |
          cd android
          MAX_ATTEMPTS=5
          RETRY_DELAY=15
          
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=========================================="
            echo "Build attempt $attempt/$MAX_ATTEMPTS"
            echo "=========================================="
            
            if ./gradlew assembleDebug \
              --no-daemon \
              --gradle-user-home="$GITHUB_WORKSPACE/.gradle" \
              -Dorg.gradle.jvmargs="-Xmx2048m" \
              --stacktrace; then
              echo "✓ Build successful!"
              exit 0
            fi
            
            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo "✗ Build failed. Retrying in $RETRY_DELAY seconds..."
              sleep $RETRY_DELAY
            else
              echo "✗ Build failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
          done

      - name: Verify APK was created
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✓ APK file created successfully"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "✗ APK file not found"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date)" >> $GITHUB_STEP_SUMMARY
